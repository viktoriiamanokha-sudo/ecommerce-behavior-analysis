version: 2

models:
  - name: stg_events
    description: "Cleaned and typed raw ecommerce events"
    columns:
      - name: user_id
        description: "Unique user identifier"
        tests:
          - not_null

      - name: event_type
        description: "Type of user action"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['view', 'cart', 'purchase']

      - name: event_time
        description: "Timestamp of the event"
        tests:
          - not_null

      - name: price
        description: "Product price at event time"
        tests:
          - not_null

      - name: user_session
        description: "Session identifier"
        tests:
          - not_null